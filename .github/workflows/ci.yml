name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --no-fund

      - name: Typecheck and test
        run: npm run ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Adversarial smoke test Sovereign Scaffold demo API
        shell: bash
        run: |
          set -euo pipefail

          npm run demo > /tmp/sovereign-scaffold-demo.log 2>&1 &
          DEMO_PID=$!
          trap 'kill $DEMO_PID 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/api/health > /tmp/health.json; then
              READY=1
              break
            fi
            sleep 0.5
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/sovereign-scaffold-demo.log
            exit 1
          fi

          node -e '
            const h = require("/tmp/health.json");
            if (!h.ok || !h.policyVersion) process.exit(1);
            if (h.executionAdapterConnected !== false || h.nodeAlphaIdentityVerified !== false) process.exit(1);
          '

          curl --silent --show-error -D /tmp/demo-headers.txt http://127.0.0.1:4173/ -o /tmp/demo-index.html
          grep -qi '^content-security-policy:' /tmp/demo-headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/demo-headers.txt
          grep -qi '^cross-origin-resource-policy: same-origin' /tmp/demo-headers.txt

          PLAIN_CODE=$(curl --silent --show-error \
            -o /tmp/plain.json \
            -w '%{http_code}' \
            -X POST \
            -H 'content-type: text/plain' \
            -d '{"proposal":{}}' \
            http://127.0.0.1:4173/api/evaluate)
          test "$PLAIN_CODE" = "415"

          CROSS_SITE_CODE=$(curl --silent --show-error \
            -o /tmp/cross-site.json \
            -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            -H 'sec-fetch-site: cross-site' \
            -d '{"proposal":{}}' \
            http://127.0.0.1:4173/api/evaluate)
          test "$CROSS_SITE_CODE" = "403"

          EVAL_CODE=$(curl --silent --show-error \
            -o /tmp/eval.json \
            -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            -d '{"proposal":{"type":"WRITE","scope":"PRODUCTION","target":"crm.customer_status","reversible":true,"dataSensitivity":"SENSITIVE","affectedRecords":47,"estimatedCost":0,"containsSecrets":false}}' \
            http://127.0.0.1:4173/api/evaluate)
          test "$EVAL_CODE" = "200"

          PROPOSAL_ID=$(node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/eval.json", "utf8"));
            if (x.decision.route !== "REQUIRE_HUMAN_APPROVAL") process.exit(1);
            if (!x.decision.policyVersion || !x.proposal.id) process.exit(1);
            process.stdout.write(x.proposal.id);
          ')

          INCOMPLETE_CODE=$(curl --silent --show-error \
            -o /tmp/incomplete.json \
            -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            -d '{"proposal":{"type":"WRITE","scope":"SANDBOX","target":"sandbox.incomplete","reversible":true,"dataSensitivity":"INTERNAL"}}' \
            http://127.0.0.1:4173/api/evaluate)
          test "$INCOMPLETE_CODE" = "200"
          node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/incomplete.json", "utf8"));
            if (x.decision.route !== "REQUIRE_HUMAN_APPROVAL") process.exit(1);
            for (const r of ["unknown_blast_radius", "unknown_cost", "unknown_secret_status"]) if (!x.decision.reasons.includes(r)) process.exit(1);
          '

          BULK_READ_CODE=$(curl --silent --show-error \
            -o /tmp/bulk-read.json \
            -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            -d '{"proposal":{"type":"READ","scope":"PRODUCTION","target":"public.catalog","reversible":true,"dataSensitivity":"PUBLIC","affectedRecords":50000,"estimatedCost":0,"containsSecrets":false}}' \
            http://127.0.0.1:4173/api/evaluate)
          test "$BULK_READ_CODE" = "200"
          node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/bulk-read.json", "utf8"));
            if (x.decision.route !== "REQUIRE_HUMAN_APPROVAL") process.exit(1);
            if (!x.decision.reasons.includes("bulk_read_requires_authority")) process.exit(1);
          '

          AUTH_CODE=$(curl --silent --show-error \
            -o /tmp/auth.json \
            -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            -d "{\"proposalId\":\"$PROPOSAL_ID\"}" \
            http://127.0.0.1:4173/api/authorize)
          test "$AUTH_CODE" = "200"

          node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/auth.json", "utf8"));
            if (x.authorized !== true || !x.policyVersion) process.exit(1);
            if (x.identityVerified !== false || x.executionAdapterConnected !== false) process.exit(1);
          '

          REPLAY_CODE=$(curl --silent --show-error \
            -o /tmp/replay.json \
            -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            -d "{\"proposalId\":\"$PROPOSAL_ID\"}" \
            http://127.0.0.1:4173/api/authorize)
          test "$REPLAY_CODE" = "404"

          FORGED_CODE=$(curl --silent --show-error \
            -o /tmp/forged.json \
            -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            -d '{"proposal":{"type":"DELETE"},"decision":{"route":"ALLOW"},"approval":{"approved":true}}' \
            http://127.0.0.1:4173/api/authorize)
          test "$FORGED_CODE" = "400"

          MALFORMED_CODE=$(curl --silent --show-error \
            -o /tmp/malformed.json \
            -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            -d '{"proposal":{"type":"READ_AND_DELETE","scope":"PRODUCTION","target":"crm.customers","reversible":"yes","dataSensitivity":"UNKNOWN","affectedRecords":-1}}' \
            http://127.0.0.1:4173/api/evaluate)
          test "$MALFORMED_CODE" = "400"

          CONTRADICTION_CODE=$(curl --silent --show-error \
            -o /tmp/contradiction.json \
            -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            -d '{"proposal":{"type":"WRITE","scope":"SANDBOX","target":"sandbox.bad","reversible":true,"dataSensitivity":"PUBLIC","affectedRecords":1,"estimatedCost":0,"containsSecrets":true}}' \
            http://127.0.0.1:4173/api/evaluate)
          test "$CONTRADICTION_CODE" = "400"

          SECRET_CODE=$(curl --silent --show-error \
            -o /tmp/secret.json \
            -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            -d '{"proposal":{"type":"EXTERNAL_MESSAGE","scope":"EXTERNAL","target":"external.webhook","reversible":false,"dataSensitivity":"SECRET","affectedRecords":1,"estimatedCost":0,"containsSecrets":true}}' \
            http://127.0.0.1:4173/api/evaluate)
          test "$SECRET_CODE" = "200"
          node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/secret.json", "utf8"));
            if (x.decision.route !== "DENY" || x.decision.requiresApproval !== false) process.exit(1);
          '

          curl --fail --silent http://127.0.0.1:4173/api/audit > /tmp/audit.json
          if grep -q 'crm.customer_status' /tmp/audit.json; then
            echo 'raw target leaked into audit ledger'
            exit 1
          fi
